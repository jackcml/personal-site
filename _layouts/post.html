---
layout: default
---

<article class="post">
  <header class="page-header">
    <p class="eyebrow">{{ page.date | date: "%B %-d, %Y" }}</p>
    <h1>{{ page.title }}</h1>
    {% if page.description %}
      <p>{{ page.description }}</p>
    {% endif %}
  </header>

  <div class="content">
    {% if page.unpublished %}
      <p>This post isn’t published yet.</p>
    {% else %}
      {{ content }}
    {% endif %}
  </div>
</article>
